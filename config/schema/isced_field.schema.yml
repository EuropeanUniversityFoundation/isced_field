field.value.isced_f:
  type: mapping
  label: Default value
  mapping:
    value:
      type: string
      label: Value
      constraints:
        Regex:
          pattern: '/^\d{2,4}$/'

field.widget.settings.isced_f_select:
  type: mapping
  label: ISCED-F select list widget settings
  mapping:
    allow_all_levels:
      type: boolean
      label: 'Allow all levels of selection'

field.formatter.settings.isced_f_default:
  type: mapping
  label: ISCED-F default formatter settings
  mapping:
    prefix:
      type: boolean
      label: 'Prefix the study field label with its ISCED-F code'

views.filter.isced:
  type: views_filter
  label: 'ISCED-F'
  mapping:
    operator:
      type: string
      label: 'Operator'
    value:
      type: sequence
      constraints:
        FullyValidatable: ~
      label: 'Values'
      sequence:
        type: string
        label: 'Value'
    expose:
      type: mapping
      label: 'Expose'
      mapping:
        reduce:
          type: boolean
          label: 'Reduce'
    group_info:
      mapping:
        group_items:
          sequence:
            type: views.filter.group_item.isced
            label: 'Group item'
